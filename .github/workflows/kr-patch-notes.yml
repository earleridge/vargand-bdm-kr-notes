name: Vargand BDM KR Patch Notes

on:
  schedule:
    # Four checks daily (UTC). GitHub may delay scheduled jobs during busy periods.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      send_latest:
        description: "Post the newest current KR patch note now (use once for a test)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Korean BDM patch notes and post summaries
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEND_LATEST_ON_FIRST_RUN: ${{ inputs.send_latest }}
        run: python monitor.py

      - name: Save duplicate-prevention state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update Korean patch-note state"
            git push
          fi
